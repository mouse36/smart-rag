<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Assistant Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 100%);
            padding: 20px;
            text-align: center;
            color: #2d3436;
            font-weight: bold;
            font-size: 18px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            animation: slideIn 0.3s ease-out;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            margin-left: auto;
        }

        .message.bot .message-bubble {
            background: linear-gradient(135deg, #fd79a8 0%, #e84393 100%);
            color: white;
        }

        .bot-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 18px;
            flex-shrink: 0;
        }

        .sun-icon {
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            animation: typing 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: scale(0.8); opacity: 0.5; }
            30% { transform: scale(1.2); opacity: 1; }
        }

        .chat-input {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            background: #f8f9fa;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            border-color: #74b9ff;
        }

        .send-button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        .send-button:hover {
            transform: scale(1.05);
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .quote-block {
            background: rgba(255, 255, 255, 0.2);
            border-left: 4px solid rgba(255, 255, 255, 0.6);
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
            font-style: italic;
        }

        .video-container {
            margin: 8px 0;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-container video {
            width: 100%;
            height: auto;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            margin: 4px 0;
            font-size: 12px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            Virtual Assistant
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="bot-icon">
                    <div class="sun-icon">☀️</div>
                </div>
                <div class="message-bubble">
                    Hello! I'm your virtual assistant specializing in selective mutism (SM). I have access to comprehensive knowledge about selective mutism, including treatment approaches, parent guidance, and educational strategies. How can I help you today?
                </div>
            </div>
        </div>
        
        <div class="chat-input">
            <input type="text" class="input-field" id="messageInput" placeholder="Type your message..." maxlength="500">
            <button class="send-button" id="sendButton">Send</button>
        </div>
    </div>

    <script>
        class ChatInterface {
            constructor() {
                this.messageInput = document.getElementById('messageInput');
                this.sendButton = document.getElementById('sendButton');
                this.chatMessages = document.getElementById('chatMessages');
                this.isTyping = false;
                this.apiBaseUrl = 'http://127.0.0.1:5000';  // Backend API URL
                
                this.initializeEventListeners();
                this.checkBackendHealth();
            }
            
            initializeEventListeners() {
                this.sendButton.addEventListener('click', () => this.sendMessage());
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.sendMessage();
                    }
                });
                
                this.messageInput.addEventListener('input', () => {
                    this.sendButton.disabled = this.messageInput.value.trim() === '';
                });
            }
            
            async sendMessage() {
                try {
                    const messageText = this.messageInput.value.trim();
                    if (!messageText || this.isTyping) return;
                    
                    this.addUserMessage(messageText);
                    this.messageInput.value = '';
                    this.sendButton.disabled = true;
                    
                    this.showTypingIndicator();
                    
                    // Send message to backend API
                    await this.sendToBackend(messageText);
                    
                } catch (error) {
                    console.error('Error sending message:', error);
                    this.hideTypingIndicator();
                    this.showError('Failed to send message. Please try again.');
                } finally {
                    this.sendButton.disabled = false;
                }
            }
            
            addUserMessage(text) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message user';
                messageDiv.innerHTML = `
                    <div class="message-bubble">${this.escapeHtml(text)}</div>
                `;
                this.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
            }
            
            showTypingIndicator() {
                this.isTyping = true;
                const typingDiv = document.createElement('div');
                typingDiv.className = 'message bot';
                typingDiv.id = 'typingIndicator';
                typingDiv.innerHTML = `
                    <div class="bot-icon">
                        <div class="sun-icon">☀️</div>
                    </div>
                    <div class="message-bubble">
                        <div class="typing-indicator">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                `;
                this.chatMessages.appendChild(typingDiv);
                this.scrollToBottom();
            }
            
            hideTypingIndicator() {
                const typingIndicator = document.getElementById('typingIndicator');
                if (typingIndicator) {
                    typingIndicator.remove();
                }
                this.isTyping = false;
            }
            
            async sendToBackend(message) {
                try {
                    const response = await fetch(`${this.apiBaseUrl}/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ message: message })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    
                    this.hideTypingIndicator();
                    
                    if (data.error) {
                        this.showError(data.error);
                        return;
                    }

                    // Add response indicator if cached
                    let responseText = data.response;
                    if (data.cached) {
                        responseText += '<div style="font-size: 0.8em; color: rgba(255,255,255,0.7); margin-top: 8px;">⚡ Cached response</div>';
                    }
                    
                    this.addBotMessage(responseText);

                } catch (error) {
                    console.error('Backend API error:', error);
                    this.hideTypingIndicator();
                    
                    // Fallback message
                    this.addBotMessage(`I apologize, but I'm having trouble connecting to my knowledge base right now. 
                        Please ensure the backend server is running and try again. 
                        <div class="error-message">Connection Error: ${error.message}</div>`);
                }
            }

            async checkBackendHealth() {
                try {
                    const response = await fetch(`${this.apiBaseUrl}/health`);
                    if (response.ok) {
                        const data = await response.json();
                        console.log('Backend health check:', data);
                        
                        if (data.status !== 'healthy') {
                            this.showConnectionWarning();
                        }
                    } else {
                        throw new Error('Health check failed');
                    }
                } catch (error) {
                    console.warn('Backend not available:', error);
                    this.showConnectionWarning();
                }
            }

            showConnectionWarning() {
                const warningDiv = document.createElement('div');
                warningDiv.style.cssText = `
                    background: #ff6b6b;
                    color: white;
                    padding: 10px;
                    margin: 10px;
                    border-radius: 8px;
                    font-size: 14px;
                    text-align: center;
                `;
                warningDiv.innerHTML = '⚠️ Backend server not available. Please start the backend to use the AI assistant.';
                
                this.chatMessages.insertBefore(warningDiv, this.chatMessages.firstChild);
                
                // Remove warning after 10 seconds
                setTimeout(() => {
                    if (warningDiv.parentNode) {
                        warningDiv.remove();
                    }
                }, 10000);
            }
            

            
            addBotMessage(content) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message bot';
                messageDiv.innerHTML = `
                    <div class="bot-icon">
                        <div class="sun-icon">☀️</div>
                    </div>
                    <div class="message-bubble">${content}</div>
                `;
                this.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
            }
            
            showError(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = message;
                this.chatMessages.appendChild(errorDiv);
                this.scrollToBottom();
                
                setTimeout(() => {
                    errorDiv.remove();
                }, 5000);
            }
            
            scrollToBottom() {
                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }
        
        // Initialize the chat interface when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            try {
                new ChatInterface();
                console.log('Chat interface initialized successfully');
            } catch (error) {
                console.error('Failed to initialize chat interface:', error);
            }
        });
    </script>
</body>
</html>
